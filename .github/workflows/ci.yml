name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SimpleDiscordDotNet.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test tests/SimpleDiscordNet.Tests/SimpleDiscordNet.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack SimpleDiscordNet/SimpleDiscordNet.csproj -c Release -o artifacts

      - name: Check the package contains the generator
        shell: bash
        run: |
          package=$(ls artifacts/*.nupkg)
          unzip -l "$package" | grep -q 'analyzers/dotnet/cs/SimpleDiscordNet.Generators.dll'

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish with Native AOT
        shell: bash
        run: |
          set -o pipefail
          dotnet publish tests/SimpleDiscordNet.AotSmoke/SimpleDiscordNet.AotSmoke.csproj -c Release -o artifacts/aot 2>&1 | tee publish.log

      # The smoke test itself calls JsonSerializer directly, so its own warnings in Program.cs are expected
      - name: Fail on library trim or AOT warnings
        shell: bash
        run: |
          if grep -E 'warning IL[0-9]+' publish.log | grep -v 'Program\.'; then
            exit 1
          fi

      - name: Run the native executable
        shell: bash
        run: ./artifacts/aot/SimpleDiscordNet.AotSmoke
